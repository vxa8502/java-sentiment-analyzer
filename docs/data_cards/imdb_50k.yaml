name: IMDB 50K Movie Reviews
version: "v1.0-maas2011"
source: http://ai.stanford.edu/~amaas/data/sentiment/
license: Public domain / Academic use

# Raw Dataset
raw:
  file: data/raw/imdb_50k/IMDB Dataset.csv
  total_samples: 50000
  columns: [review, sentiment]
  class_distribution:
    positive: 25000
    negative: 25000

# Training Split (80/20, seed=42)
training:
  method: "Stratified 80/20 split (no separate validation set)"
  max_samples: 50000  # Cap applied before splitting
  train_samples: 40000
  test_samples: 10000
  cross_validation: "5-fold CV used internally for hyperparameter tuning"

# Processed Test Set (saved for cross-domain evaluation)
processed:
  file: data/processed/imdb_50k/test.csv
  samples: 10000

# Actual Training Run (January 2026)
# Note: Actual samples may vary slightly due to stratified sampling
actual_training_run:
  train_samples: 39995
  test_samples: 9999
  notes: "Stratified sampling ensures class balance; slight variance from theoretical split"

# Preparation
preparation:
  prerequisites:
    - Kaggle account (free)
  steps:
    - Visit https://www.kaggle.com/datasets/lakshmi25npathi/imdb-dataset-of-50k-movie-reviews
    - Click "Download" (requires Kaggle login)
    - Extract the ZIP file
    - Move "IMDB Dataset.csv" to data/raw/imdb_50k/
  verification: |
    python3 -c "import csv; r=list(csv.reader(open('data/raw/imdb_50k/IMDB Dataset.csv'))); print('Rows:', len(r)-1)"
    # Expected: 50000

# Data Quality
known_biases:
  - expert_reviewer_skew: "Prolific reviewers overrepresented"
  - genre_imbalance: "Drama 38%, Action 22%, Comedy 19%"
  - length_bias: "Positive reviews avg 243 words, negative avg 221 words"

measurement_issues:
  - rating_threshold_artifact: "Positive=7-10 stars, Negative=1-4 stars (excludes 5-6 neutral)"
  - html_artifacts: "Contains <br /> HTML tags in text"

edge_cases:
  - genre_confusion: "Horror movies use negative vocabulary in positive reviews"
  - irony: "So bad it's good reviews labeled positive"
  - comparative_sentiment: "Better than the first (but still bad)"

# Validation
human_agreement: 0.89
noise_estimate: "~11% label noise"
label_source: "User ratings on IMDB"

# Citation
citation: |
  @InProceedings{maas-EtAl:2011:ACL-HLT2011,
    author = {Maas, Andrew L. and Daly, Raymond E. and Pham, Peter T. and Huang, Dan and Ng, Andrew Y. and Potts, Christopher},
    title = {Learning Word Vectors for Sentiment Analysis},
    year = {2011}
  }
