version: '3.8'

services:
  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-analyzer
    image: sentiment-analyzer:latest
    ports:
      - "8080:8080"
    environment:
      # Application profile (dev, production, test)
      - SPRING_PROFILES_ACTIVE=production

      # Model configuration
      - SENTIMENT_MODEL_TYPE=svm  # Options: svm, naive_bayes, random_forest, logistic_regression
      - SENTIMENT_CONFIDENCE_THRESHOLD=0.7
      - SENTIMENT_PREFER_PRETRAINED=true
      - SENTIMENT_REQUIRE_PRETRAINED=false

      # Model paths (if using custom models)
      - SENTIMENT_SVM_MODEL=/app/models/svm-model.ser
      - SENTIMENT_NAIVE_BAYES_MODEL=/app/models/naive_bayes-model.ser
      - SENTIMENT_RANDOM_FOREST_MODEL=/app/models/random_forest-model.ser

      # Preprocessing configuration
      - SENTIMENT_PREPROCESSING_MIN_WORD_LENGTH=2
      - SENTIMENT_PREPROCESSING_MAX_FEATURES=5000
      - SENTIMENT_PREPROCESSING_USE_TFIDF=true
      - SENTIMENT_PREPROCESSING_USE_BIGRAMS=true

      # API configuration
      - SENTIMENT_API_MAX_BATCH_SIZE=100
      - SENTIMENT_API_RATE_LIMIT=1000
      - SENTIMENT_API_VALIDATION_MAX_TEXT_LENGTH=10000

      # JVM tuning (adjust based on container resources)
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200

      # Logging configuration
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_SENTIMENT=INFO

    volumes:
      # Mount local models directory (optional, for custom models)
      - ./models:/app/models

      # Mount local data directory (optional, for training)
      - ./data:/app/data

      # Mount logs directory (optional, for persistent logs)
      # - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

    networks:
      - sentiment-network

    labels:
      - "com.sentiment-analyzer.description=Java Sentiment Analysis API"
      - "com.sentiment-analyzer.version=1.0.0"

networks:
  sentiment-network:
    driver: bridge
    name: sentiment-network

