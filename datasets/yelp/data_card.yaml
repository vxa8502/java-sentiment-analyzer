name: Yelp Reviews Dataset
version: "custom-subset"
source: Yelp Open Dataset
license: Free for academic use

# Dataset Size
size:
  total: 281,082 reviews

# Format
format: CSV
columns:
  - text (review content)
  - sentiment (positive/negative/neutral likely)

# Data Quality
class_distribution: "Unknown - needs analysis"

known_biases:
  - business_type_bias: "Restaurant reviews may dominate"
  - geographic_bias: "Varies by region"
  - length_variation: "Service complaints vs praise have different lengths"

measurement_issues:
  - sentiment_labeling: "Unknown how sentiment was derived"
  - temporal_drift: "Reviews span multiple years"

edge_cases:
  - business_jargon: "Industry-specific terminology"
  - service_vs_product: "Mixed sentiment (good food, bad service)"

# Validation
human_agreement: "Not measured"
label_source: "Unknown - needs investigation"

# Notes
notes: |
  - First 100K rows loaded via streaming loader (then shuffled)
  - Need to validate class distribution
  - Need to verify sentiment label quality
  - Consider this dataset exploratory until validated
