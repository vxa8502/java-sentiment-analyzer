server:
  port: ${PORT:8080}

logging:
  level:
    sentiment: INFO
    root: WARN
  # File logging configured in logback-spring.xml (logs/sentiment-analyzer.log)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: sentiment-analyzer
      environment: ${SPRING_PROFILES_ACTIVE:unknown}
      version: ${APP_VERSION:dev}

# Main sentiment analyzer configuration
sentiment:
  # Model configuration
  model-type: svm  # Production model: SVM (Amazon) - 88.0% cross-domain accuracy
  confidence-threshold: 0.7

  # Data paths - Docker-friendly defaults (use environment variables to override)
  data-path: "${SENTIMENT_DATA_PATH:/app/data}"
  models-path: "${SENTIMENT_MODELS_PATH:/app/models}"

  # Pre-trained model paths (set to load specific models at startup)
  # Models can be generated using sentiment.training.ModelTrainer
  models:
    # Production model (SVM trained on Amazon - best cross-domain performance)
    # Cross-domain avg: 88.0%
    production-model-path: "${SENTIMENT_PRODUCTION_MODEL:/app/models/production/sentiment_model.ser}"

    # Path to pre-trained SVM model (default model used by the application)
    svm-model-path: "${SENTIMENT_SVM_MODEL:/app/models/production/sentiment_model.ser}"

    # Paths to other pre-trained models (for model comparison endpoint)
    naive-bayes-model-path: "${SENTIMENT_NB_MODEL:/app/models/naive_bayes-model.ser}"
    random-forest-model-path: "${SENTIMENT_RF_MODEL:/app/models/random_forest-model.ser}"
    logistic-model-path: "${SENTIMENT_LR_MODEL:/app/models/logistic_regression-model.ser}"

    # Load pre-trained model if available (skips training at startup)
    prefer-pretrained: true

    # Fail startup if no model is available (false = train minimal model as fallback)
    require-pretrained: false

  # Training configuration
  training:
    # Random seed for reproducibility (shuffle, splits, CV)
    # Set to different values to assess variance across runs
    random-seed: ${SENTIMENT_RANDOM_SEED:42}

  # Feature extraction configuration (shared across entire pipeline)
  # Single source of truth for all preprocessing, feature extraction, and Weka conversion
  # This ensures consistency across: tokenization → feature extraction → Weka conversion
  # and prevents vocabulary mismatches
  features:
    # Maximum number of features to extract for TF-IDF
    max-features: 5000

    # Minimum term frequency for a word to be included
    # 1 = Allow single-occurrence terms to prevent vocabulary=0
    min-term-freq: 1

    # Enable TF-IDF transformation for feature extraction
    use-tfidf: true

    # Enable bigram features (unigrams + bigrams)
    use-bigrams: true

    # Minimum word length to include in tokenization
    min-word-length: 2

    # Batch size for processing large datasets
    batch-size: 1000

    # Threshold for triggering MI-based feature selection
    # When raw vocabulary exceeds this, MI is used to select discriminative features
    # Flow: raw vocab → MI selection (if > threshold) → max-features limit
    mi-selection-threshold: ${SENTIMENT_MI_THRESHOLD:50000}

  # SVM specific configuration
  svm:
    # Kernel type: linear, polynomial, rbf, sigmoid
    kernel-type: linear

    # C parameter for regularization
    c-parameter: 1.0

    # Enable probability estimates
    enable-probability: true

    # Hyperparameter tuning configuration
    hyperparameter-tuning:
      # Enable grid search during training (disabled by default for fast training)
      # WARNING: Increases training time 5-10x but may improve accuracy by 2-5%
      # Recommended: Enable for final production models, disable for experimentation
      enabled: ${SENTIMENT_SVM_TUNE_ENABLED:false}

      # Cross-validation folds for grid search
      cv-folds: ${SENTIMENT_SVM_TUNE_FOLDS:5}

    # Class imbalance threshold (ratio) for enabling class weighting
    # If max_class_count / min_class_count > threshold, class weighting is enabled
    # Default: 3.0 (e.g., 3:1 ratio triggers weighting)
    # This threshold is automatically applied during training and model loading
    class-imbalance-threshold: ${SENTIMENT_SVM_CLASS_IMBALANCE_THRESHOLD:3.0}

  # Model comparison settings
  comparison:
    # Algorithms to compare: svm, naive_bayes, random_forest, logistic
    algorithms:
      - svm
      - naive_bayes
      - random_forest

    # Enable detailed evaluation metrics
    detailed-metrics: true

    # Generate confusion matrices
    generate-confusion-matrix: true

    # Export results to files
    export-results: true

  # Model versioning configuration
  versioning:
    # Directory where versioned models are stored
    models-directory: "${SENTIMENT_MODELS_DIR:/app/models}"

    # Automatically discover and register models on startup
    auto-discover: true

    # Default version to activate on startup (leave empty to use latest)
    default-version: "${SENTIMENT_DEFAULT_VERSION:}"

    # Enable A/B testing infrastructure
    ab-testing-enabled: true

    # Percentage of traffic to route to shadow version (for A/B tests)
    shadow-traffic-percentage: 10

    # Enable automatic rollback on high error rate
    auto-rollback-enabled: false

    # Error rate threshold for automatic rollback (e.g., 0.05 = 5%)
    rollback-error-threshold: 0.05

    # Number of predictions to evaluate before rollback decision
    rollback-evaluation-window: 1000

  # API configuration
  api:
    # Maximum batch size for batch predictions
    max-batch-size: 100

    # Enable request/response logging
    enable-logging: true

    # Rate limiting (requests per minute)
    rate-limit: 1000

  # Data loading configuration
  data:
    # Supported file formats
    supported-formats:
      - csv
      - json
      - txt

    # Default encoding for text files
    default-encoding: UTF-8

    # Sample size for dataset analysis
    analysis-sample-size: 1000

    # Enable data validation
    validate-data: true

    # Memory and statistical limits for dataset loading
    # These limits prevent OOM errors and ensure statistical validity
    limits:
      # Maximum datasets to load from a single file (default: 100,000)
      # Estimated memory: ~100MB assuming 1KB per text sample
      max-datasets-per-file: 100000

      # Maximum combined datasets across multiple files (default: 500,000)
      # Estimated memory: ~500MB assuming 1KB per text sample
      max-combined-datasets: 500000

      # Maximum file size in MB before warning/rejection (default: 500)
      max-file-size-mb: 2000

      # Percentage threshold (50-100) to trigger warnings before hitting hard limits (default: 80)
      # When reaching this percentage, warnings are logged
      warn-threshold-percent: 80

      # Whether to enforce limits strictly (throw exception) or just warn (default: true)
      # true = throw DataLoadingException when limit exceeded
      # false = log warning but continue processing
      strict-enforcement: false

      # Estimated number of features for statistical validation (default: 5000)
      # Used to calculate minimum required samples for statistical power
      # Should match sentiment.features.max-features or sentiment.preprocessing.max-features
      estimated-features: 5000

# Spring profiles configuration
# NOTE: No default profile set - must be explicitly specified via SPRING_PROFILES_ACTIVE
# environment variable to prevent accidental dev configuration in production
spring:
  # JSON serialization settings
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Resilience4j Configuration
resilience4j:
  ratelimiter:
    instances:
      # Rate limiter for sentiment analysis endpoints
      sentimentApi:
        limit-for-period: 100        # 100 requests per minute (reasonable default)
        limit-refresh-period: 1m     # Time period (1 minute)
        timeout-duration: 0ms        # Don't wait, fail immediately if limit exceeded
        register-health-indicator: true
        allow-health-indicator-to-fail: true
        event-consumer-buffer-size: 100

      # Rate limiter for batch endpoints (lower limit due to higher load)
      batchApi:
        limit-for-period: 20         # 20 batch requests per minute
        limit-refresh-period: 1m
        timeout-duration: 0ms
        register-health-indicator: true
        allow-health-indicator-to-fail: true
        event-consumer-buffer-size: 100

      # Rate limiter for model comparison (very resource intensive)
      comparisonApi:
        limit-for-period: 2
        limit-refresh-period: 5m
        timeout-duration: 0ms
        register-health-indicator: true
        allow-health-indicator-to-fail: true
        event-consumer-buffer-size: 50

  # Circuit breaker for model inference
  # Prevents cascading failures when model loading/prediction fails
  circuitbreaker:
    instances:
      modelInference:
        # Open circuit if 50% of requests fail
        failure-rate-threshold: 50
        # Slow requests (>2s) also count as failures
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        # Wait 30s before trying again (gives model time to recover)
        wait-duration-in-open-state: 30s
        # Try 3 test requests when half-open
        permitted-number-of-calls-in-half-open-state: 3
        # Evaluate based on last 10 requests
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        # Minimum requests before circuit can open (prevents premature tripping)
        minimum-number-of-calls: 5
        register-health-indicator: true

# Development profile specific settings
---
spring:
  config:
    activate:
      on-profile: development

logging:
  level:
    sentiment: DEBUG
    org.springframework: INFO
    weka: WARN

sentiment:
  features:
    max-features: 1000  # Smaller for faster development
    batch-size: 100
  api:
    rate-limit: 10000   # Higher limit for development

resilience4j:
  ratelimiter:
    instances:
      sentimentApi:
        limit-for-period: 100  # Higher limit for development
        limit-refresh-period: 1m
      batchApi:
        limit-for-period: 50
        limit-refresh-period: 1m
      comparisonApi:
        limit-for-period: 10
        limit-refresh-period: 5m

# Production profile specific settings
---
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    sentiment: INFO
    root: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus  # Restrict endpoints in production
  endpoint:
    health:
      show-details: never  # Don't expose internal details publicly

sentiment:
  features:
    max-features: 10000  # More features for better accuracy
    batch-size: 5000     # Larger batches for efficiency
  api:
    rate-limit: 100      # Conservative limit for production
    enable-logging: false # Disable verbose logging

resilience4j:
  ratelimiter:
    instances:
      sentimentApi:
        limit-for-period: 60  # Conservative limit for production
        limit-refresh-period: 1m
      batchApi:
        limit-for-period: 10
        limit-refresh-period: 1m
      comparisonApi:
        limit-for-period: 5
        limit-refresh-period: 10m

# Test profile specific settings
---
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    sentiment: WARN
    org.springframework: WARN
    weka: ERROR

sentiment:
  features:
    max-features: 100    # Minimal features for fast tests
    batch-size: 10
  data:
    max-file-size-mb: 1  # Small files for tests